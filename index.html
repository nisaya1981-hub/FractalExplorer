<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FractalExplorer</title>

    <!-- Tailwind CSS & Google Fonts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- PDF.js for rendering PDF documents -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #090d16;
            font-family: 'Inter', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        #viewport-canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            cursor: grab;
        }

        #viewport-canvas:active {
            cursor: grabbing;
        }

        .glass-panel {
            background: rgba(15, 23, 42, 0.88);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(51, 65, 85, 0.6);
        }

        .tree-item:hover {
            background-color: rgba(51, 65, 85, 0.5);
        }
        .tree-item.active {
            background-color: rgba(14, 165, 233, 0.25);
            border-left: 3px solid #38bdf8;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 3px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #0f172a;
        }
    </style>
</head>
<body class="text-slate-200">

    <!-- Main Viewport Canvas -->
    <canvas id="viewport-canvas"></canvas>

    <!-- Inverse L-Shape UI Container -->
    <!-- 1. Top Bar (Horizontal Part of L) -->
    <header class="fixed top-0 left-0 right-0 h-14 glass-panel border-b border-slate-700/60 z-30 flex items-center justify-between px-4">
        <!-- App Title / Brand -->
        <div class="flex items-center space-x-3 min-w-[220px]">
            <div class="w-8 h-8 rounded-lg bg-blue-600/20 border border-blue-500/40 flex items-center justify-center text-blue-400 font-bold">
                ❄️
            </div>
            <div>
        <h1 class="text-sm font-semibold text-slate-100 leading-tight">FractalExplorer</h1>
                <p class="text-[10px] text-slate-400 font-mono" id="status-text">Multi-Root Workspace</p>
            </div>
        </div>

        <!-- Path Search & Navigation Input (Center) -->
        <div class="flex-1 max-w-2xl mx-4 flex items-center space-x-2">
            <div class="relative w-full">
                <input type="text" id="path-input" placeholder="Type or select a path/filename to zoom..." 
                    onkeydown="if(event.key==='Enter') jumpToEnteredPath()"
                    class="w-full bg-slate-900/90 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-slate-200 font-mono focus:outline-none focus:border-blue-500 transition-all pr-8">
                <button onclick="jumpToEnteredPath()" title="Zoom to Path" class="absolute right-2 top-1.5 text-slate-400 hover:text-blue-400">
                    🔍
                </button>
            </div>
            <button onclick="jumpToEnteredPath()" class="px-3 py-1.5 rounded-lg bg-blue-600 hover:bg-blue-500 text-white text-xs font-medium transition-all shadow-md shrink-0">
                Zoom to Target
            </button>
        </div>

        <!-- Action Controls (Right) -->
        <div class="flex items-center space-x-2">
            <input type="file" id="folder-input" webkitdirectory directory multiple class="hidden" onchange="handleBrowserFolderSelect(event)">
            
            <button onclick="triggerFolderSelect()" class="px-3 py-1.5 rounded-lg bg-blue-600 hover:bg-blue-500 text-white text-xs font-medium transition-all shadow-md flex items-center space-x-1.5">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                <span>+ Add Folder / Drive</span>
            </button>

            <button onclick="resetZoom()" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-medium transition-all border border-slate-700 flex items-center space-x-1">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 00-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 00-1 1m-6 0h6"></path></svg>
                <span>Reset View</span>
            </button>
        </div>
    </header>

    <!-- 2. Left Sidebar (Vertical Part of L) -->
    <aside id="left-sidebar" class="fixed top-14 left-0 bottom-0 w-80 glass-panel border-r border-slate-700/60 z-20 flex flex-col justify-between overflow-hidden shadow-2xl">
        
        <!-- Tree View Section (Top Half) -->
        <div class="p-3 border-b border-slate-800 flex-1 flex flex-col min-h-0">
            <div class="flex items-center justify-between mb-2 px-1">
                <span class="text-xs font-semibold text-slate-300 tracking-wide uppercase">Workspace Hierarchy</span>
                <span class="text-[10px] text-slate-500 font-mono" id="tree-node-count">0 items</span>
            </div>
            <div id="tree-view-container" class="flex-1 overflow-y-auto custom-scrollbar space-y-0.5 text-xs font-mono pr-1">
                <div class="text-slate-500 italic p-2 text-center text-[11px]">No items in workspace</div>
        </div>
    </div>

        <!-- Selected Item Properties Section (Bottom Half) -->
        <div class="p-3 bg-slate-950/60 border-t border-slate-800 h-64 flex flex-col">
            <div class="flex items-center justify-between mb-2">
                <span class="text-xs font-semibold text-slate-300 tracking-wide uppercase">Item Properties</span>
                <span id="prop-type-badge" class="px-1.5 py-0.5 rounded text-[10px] font-mono bg-slate-800 text-slate-400">None</span>
            </div>
            
            <div id="properties-panel" class="flex-1 overflow-y-auto custom-scrollbar text-xs space-y-2 pr-1">
                <div class="text-slate-500 italic text-center py-6 text-[11px]">Click a file or folder to view details</div>
            </div>
        </div>

    </aside>

    <!-- Right-Click Context Menu -->
    <div id="context-menu" class="fixed hidden z-50 glass-panel py-1.5 rounded-xl shadow-2xl w-64 border border-slate-700/80 divide-y divide-slate-800">
        <div class="px-3 py-1.5 text-[11px] font-mono text-slate-400 bg-slate-900/40 rounded-t-xl truncate" id="ctx-item-name">
            Item Name
        </div>
        
        <div class="py-1">
            <button onclick="ctxOpenDefaultApp()" class="w-full text-left px-3 py-1.5 text-xs text-slate-200 hover:bg-slate-800 hover:text-white flex items-center space-x-2 transition-all">
                <span class="text-sm">🚀</span>
                <span>関連アプリで開く</span>
        </button>
            <button onclick="ctxShowInExplorer()" class="w-full text-left px-3 py-1.5 text-xs text-slate-200 hover:bg-slate-800 hover:text-white flex items-center space-x-2 transition-all">
                <span class="text-sm">📂</span>
                <span>エクスプローラーで開く</span>
            </button>
        </div>
    
        <div class="py-1">
            <button onclick="ctxCutItem()" class="w-full text-left px-3 py-1.5 text-xs text-slate-200 hover:bg-slate-800 hover:text-white flex items-center space-x-2 transition-all">
                <span class="text-sm">✂️</span>
                <span>切り取り (Cut)</span>
            </button>
            <button onclick="ctxCopyItem()" class="w-full text-left px-3 py-1.5 text-xs text-slate-200 hover:bg-slate-800 hover:text-white flex items-center space-x-2 transition-all">
                <span class="text-sm">📋</span>
                <span>コピー (Copy)</span>
            </button>
            <button id="ctx-btn-paste" onclick="ctxPasteItem()" class="w-full text-left px-3 py-1.5 text-xs text-slate-200 hover:bg-slate-800 hover:text-white flex items-center space-x-2 transition-all disabled:opacity-40 disabled:pointer-events-none">
                <span class="text-sm">📥</span>
                <span>貼り付け (Paste)</span>
            </button>
        </div>
    
        <div class="py-1">
            <button onclick="ctxPromptNewItem('file')" class="w-full text-left px-3 py-1.5 text-xs text-slate-200 hover:bg-slate-800 hover:text-white flex items-center space-x-2 transition-all">
                <span class="text-sm">📄</span>
                <span>新規ファイル作成</span>
            </button>
            <button onclick="ctxPromptNewItem('folder')" class="w-full text-left px-3 py-1.5 text-xs text-slate-200 hover:bg-slate-800 hover:text-white flex items-center space-x-2 transition-all">
                <span class="text-sm">📁</span>
                <span>新規フォルダ作成</span>
            </button>
        </div>
    
        <div class="py-1">
            <button onclick="ctxPromptRename()" class="w-full text-left px-3 py-1.5 text-xs text-slate-200 hover:bg-slate-800 hover:text-white flex items-center space-x-2 transition-all">
                <span class="text-sm">✏️</span>
                <span>名前の変更 (Rename)</span>
            </button>
            <button onclick="ctxDeleteItem()" class="w-full text-left px-3 py-1.5 text-xs text-rose-400 hover:bg-rose-950/40 hover:text-rose-300 flex items-center space-x-2 transition-all">
                <span class="text-sm">🗑️</span>
                <span>削除 (ゴミ箱へ移動)</span>
            </button>
        </div>
    
        <div class="py-1">
            <button onclick="ctxCopyFullPath()" class="w-full text-left px-3 py-1.5 text-xs text-slate-300 hover:bg-slate-800 hover:text-white flex items-center space-x-2 transition-all">
                <span class="text-sm">🔗</span>
                <span>フルパスをコピー</span>
            </button>
            <button onclick="ctxCopyFileName()" class="w-full text-left px-3 py-1.5 text-xs text-slate-300 hover:bg-slate-800 hover:text-white flex items-center space-x-2 transition-all">
                <span class="text-sm">📝</span>
                <span>ファイル名をコピー</span>
            </button>
        </div>
    
        <div class="py-1" id="ctx-root-delete-group">
            <button onclick="removeSelectedRoot()" class="w-full text-left px-3 py-1.5 text-xs text-amber-400 hover:bg-amber-950/40 hover:text-amber-300 flex items-center space-x-2 transition-all">
                <span class="text-sm">❌</span>
                <span>ルートフォルダをワークスペースから除外</span>
            </button>
        </div>
    </div>
    
    <!-- Operation Input Dialog Modal -->
    <div id="action-modal" class="fixed inset-0 bg-slate-950/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="glass-panel p-5 rounded-2xl w-full max-w-md shadow-2xl border border-slate-700">
            <h3 class="text-sm font-bold text-slate-100 mb-2" id="modal-title">Input</h3>
            <p class="text-xs text-slate-400 mb-3" id="modal-desc">Description text</p>
            <input type="text" id="modal-input" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-100 font-mono focus:outline-none focus:border-blue-500 mb-4" onkeydown="if(event.key==='Enter') submitActionModal()">
            <div class="flex justify-end space-x-2">
                <button onclick="closeActionModal()" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-medium border border-slate-700">
                    Cancel
                </button>
                <button onclick="submitActionModal()" class="px-3 py-1.5 rounded-lg bg-blue-600 hover:bg-blue-500 text-white text-xs font-medium shadow">
                    Confirm
                </button>
            </div>
        </div>
    </div>

    <!-- Drag & Drop Hint Overlay -->
    <div id="drop-overlay" class="fixed inset-0 bg-blue-950/80 backdrop-blur-md z-50 flex flex-col items-center justify-center border-4 border-dashed border-blue-500 m-6 rounded-3xl opacity-0 pointer-events-none transition-opacity duration-200">
        <svg class="w-16 h-16 text-blue-400 mb-4 animate-bounce" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
        <p class="text-xl font-bold text-white">Drop Folder(s) or Drive(s) to Append to Workspace</p>
        <p class="text-sm text-blue-300 mt-1">Multi-root 16:9 flat zoom panels</p>
    </div>

    <script>
        let ipcRenderer = null;
        try {
            if (typeof require !== 'undefined') {
                const electron = require('electron');
                ipcRenderer = electron.ipcRenderer;
            }
        } catch(e) {}

        const canvas = document.getElementById('viewport-canvas');
        const ctx = canvas.getContext('2d');

        if (window.pdfjsLib) {
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        }

        // Categorized File Extensions
        const IMAGE_EXTS = ['png', 'jpg', 'jpeg', 'gif', 'svg', 'webp', 'bmp', 'ico'];
        const TEXT_EXTS = ['txt', 'js', 'jsx', 'ts', 'tsx', 'html', 'css', 'json', 'py', 'md', 'c', 'cpp', 'h', 'hpp', 'java', 'cs', 'php', 'rb', 'go', 'rs', 'swift', 'kt', 'sh', 'bat', 'cmd', 'xml', 'yaml', 'yml', 'ini', 'cfg', 'conf', 'log', 'csv', 'sql', 'env'];
        const ARCHIVE_EXTS = ['zip', 'rar', '7z', 'tar', 'gz', 'bz2', 'xz', 'cab', 'tgz', 'iso'];
        const BINARY_EXTS = ['exe', 'dll', 'sys', 'bin', 'dat', 'so', 'dylib', 'msi', 'com', 'drv', 'ocx', 'class', 'o', 'obj', 'elf', 'pkg', 'dmg'];
        const VIDEO_EXTS = ['mp4', 'mkv', 'webm', 'avi', 'mov', 'flv', 'wmv'];
        const AUDIO_EXTS = ['mp3', 'wav', 'ogg', 'flac', 'm4a', 'aac'];
        const DOC_EXTS = ['pdf', 'doc', 'docx', 'xls', 'xlsx', 'ppt', 'pptx'];

        // Helper: Check if item/folder is hidden (. or $ prefix)
        function isItemHidden(name) {
            if (!name) return false;
            return name.startsWith('.') || name.startsWith('$');
        }

        const state = {
            transform: { x: window.innerWidth / 2, y: window.innerHeight / 2, scale: 0.85 },
            isDragging: false,
            dragStart: { x: 0, y: 0 },
            mouseDownPos: { x: 0, y: 0 },
            mouse: { x: 0, y: 0 },
            rootNode: null,
            isLoadingFolder: false,
            selectedContextNode: null,
            selectedNode: null,
            clipboard: null, // { action: 'cut'|'copy', node: Node }
            activeModalCallback: null
        };

        function initCanvases() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            window.addEventListener('resize', () => {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                renderScene();
            });
        }

        function createEmptyWorkspace() {
            return {
                id: 'workspace_root',
                name: 'Multi-Root Workspace',
                type: 'folder',
                ext: '',
                content: '',
                children: [],
                x: 0, y: 0, width: 1600, height: 900,
                depth: 0,
                scanned: true,
                isExpanded: true
            };
        }

        function sortNodeChildren(node) {
            if (!node || !node.children || node.children.length === 0) return;
            node.children.sort((a, b) => {
                if (a.type !== b.type) {
                    return a.type === 'folder' ? -1 : 1;
                }
                return a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' });
            });
        }

        function layoutNodeHierarchy(node, x, y, width, height, depth) {
            node.x = x;
            node.y = y;
            node.width = width;
            node.height = height;
            node.depth = depth;

            if (node.type === 'folder' && node.children.length > 0) {
                sortNodeChildren(node);
                const headerH = height * (depth === 0 ? 0.08 : 0.13);
                // Proportional padding without floor threshold to prevent layout overflow in deep nesting
                const pad = Math.min(6, Math.max(0.0001, width * 0.008));

                const contentX = x + pad;
                const contentY = y + headerH + pad;
                const contentW = Math.max(0.001, width - pad * 2);
                const contentH = Math.max(0.001, height - headerH - pad * 2);

                const count = node.children.length;
                const targetAspect = 16 / 9;

                let bestCols = 1;
                let bestRows = count;
                let maxCellArea = -1;
                let bestCellW = 0;
                let bestCellH = 0;

                for (let cols = 1; cols <= count; cols++) {
                    const rows = Math.ceil(count / cols);
                    
                    const totalPadW = (cols - 1) * pad;
                    const totalPadH = (rows - 1) * pad;

                    const availCellW = (contentW - totalPadW) / cols;
                    const availCellH = (contentH - totalPadH) / rows;

                    if (availCellW <= 0 || availCellH <= 0) continue;

                    let cellW = availCellW;
                    let cellH = cellW / targetAspect;

                    if (cellH > availCellH) {
                        cellH = availCellH;
                        cellW = cellH * targetAspect;
                    }

                    if (cellW > 0 && cellH > 0) {
                        const area = cellW * cellH;
                        if (area > maxCellArea) {
                            maxCellArea = area;
                            bestCols = cols;
                            bestRows = rows;
                            bestCellW = cellW;
                            bestCellH = cellH;
                        }
                    }
                }

                // Fallback for deeply nested or tightly constrained panels
                if (maxCellArea <= 0 || bestCellW <= 0 || bestCellH <= 0) {
                    bestCols = Math.ceil(Math.sqrt(count));
                    bestRows = Math.ceil(count / bestCols);
                    bestCellW = Math.max(0.001, (contentW - (bestCols - 1) * pad) / bestCols);
                    bestCellH = Math.max(0.001, bestCellW / targetAspect);
                    if ((bestRows * bestCellH + (bestRows - 1) * pad) > contentH) {
                        bestCellH = Math.max(0.001, (contentH - (bestRows - 1) * pad) / bestRows);
                        bestCellW = Math.max(0.001, bestCellH * targetAspect);
                    }
                }

                const gridTotalW = bestCols * bestCellW + (bestCols - 1) * pad;
                const gridTotalH = bestRows * bestCellH + (bestRows - 1) * pad;

                const startX = contentX + Math.max(0, (contentW - gridTotalW) / 2);
                const startY = contentY + Math.max(0, (contentH - gridTotalH) / 2);

                for (let i = 0; i < count; i++) {
                    const r = Math.floor(i / bestCols);
                    const c = i % bestCols;

                    const childX = startX + c * (bestCellW + pad);
                    const childY = startY + r * (bestCellH + pad);

                    layoutNodeHierarchy(node.children[i], childX, childY, bestCellW, bestCellH, depth + 1);
                }
            }
        }

        async function triggerLazyFolderScan(node, forceReScan = false) {
            if ((node.scanned && !forceReScan) || node.isScanning) return;

            // Do not expand contents of hidden folders
            if (node.isHidden) {
                node.scanned = true;
                node.children = [];
                node.isScanning = false;
                renderScene();
                return;
            }

            node.isScanning = true;
            renderScene();

            if (ipcRenderer && node.nativePath) {
                try {
                    const res = await ipcRenderer.invoke('fs:readDir', node.nativePath);
                    if (res.success && res.items) {
                        node.children = [];
                        for (const item of res.items) {
                            const isHidden = item.isHidden || isItemHidden(item.name);

                            node.children.push({
                                id: 'node_' + Math.random().toString(36).substr(2, 9),
                                name: item.name,
                                nativePath: item.path,
                                type: item.type,
                                ext: item.ext,
                                content: '',
                                children: [],
                                x: 0, y: 0, width: 1600, height: 900,
                                depth: node.depth + 1,
                                scanned: false,
                                isScanning: false,
                                isHidden: isHidden,
                                isOnlineOnly: item.isOnlineOnly || false,
                                isManualLoaded: false,
                                isExpanded: false,
                                parent: node
                            });
                        }
                        sortNodeChildren(node);
                        node.scanned = true;
                        
                        if (state.rootNode) {
                            layoutNodeHierarchy(state.rootNode, 0, 0, 1600, 900, 0);
                        }
                    }
                } catch (e) {
                    console.error('On-demand scan error:', e);
                } finally {
                    node.scanned = true;
                    node.isScanning = false;
                    renderScene();
                    renderTreeView();
                }
            } else if (node.directoryHandle) {
                try {
                    node.children = [];
                    for await (const entry of node.directoryHandle.values()) {
                        const isDir = entry.kind === 'directory';
                        const ext = !isDir && entry.name.includes('.') ? entry.name.split('.').pop().toLowerCase() : '';
                        const isHidden = isItemHidden(entry.name);

                        node.children.push({
                            id: 'node_' + Math.random().toString(36).substr(2, 9),
                            name: entry.name,
                            type: isDir ? 'folder' : 'file',
                            ext: ext,
                            content: '',
                            children: [],
                            x: 0, y: 0, width: 1600, height: 900,
                            depth: node.depth + 1,
                            scanned: false,
                            isScanning: false,
                            isHidden: isHidden,
                            isOnlineOnly: false,
                            isManualLoaded: false,
                            isExpanded: false,
                            directoryHandle: isDir ? entry : null,
                            fileHandle: !isDir ? entry : null,
                            parent: node
                        });
                    }
                    sortNodeChildren(node);
                    node.scanned = true;
                    if (state.rootNode) {
                        layoutNodeHierarchy(state.rootNode, 0, 0, 1600, 900, 0);
                    }
                } catch(e) {
                    console.error('Handle scan error:', e);
                } finally {
                    node.scanned = true;
                    node.isScanning = false;
                    renderScene();
                    renderTreeView();
                }
            } else {
                node.scanned = true;
                node.isScanning = false;
                renderScene();
                renderTreeView();
            }
        }

        async function triggerLazyFileContentLoad(node) {
            if (node.contentLoaded || node.isContentLoading) return;

            // PREVENT AUTOMATIC CLOUD DOWNLOAD: Skip auto-load for online-only files unless manually triggered
            if (node.isOnlineOnly && !node.isManualLoaded) return;

            node.isContentLoading = true;

            if (ipcRenderer && node.nativePath && TEXT_EXTS.includes(node.ext)) {
                try {
                    const res = await ipcRenderer.invoke('fs:readFilePreview', { filePath: node.nativePath });
                    if (res.success) {
                        node.content = res.content;
                    }
                } catch(e) {}
            } else if (node.fileHandle && TEXT_EXTS.includes(node.ext)) {
                try {
                    const file = await node.fileHandle.getFile();
                    node.content = await file.text();
                } catch(e) {}
            } else if (node.fileObj && TEXT_EXTS.includes(node.ext)) {
                try {
                    node.content = await node.fileObj.text();
                } catch(e) {}
            }

            node.contentLoaded = true;
            node.isContentLoading = false;
            renderScene();
        }

        async function triggerLazyPdfLoad(node) {
            if (node.pdfDoc || node.isPdfLoading || !window.pdfjsLib) return;

            // PREVENT AUTOMATIC CLOUD DOWNLOAD for PDF
            if (node.isOnlineOnly && !node.isManualLoaded) return;

            node.isPdfLoading = true;
            node.currentPage = node.currentPage || 1;

            try {
                let loadingTask = null;
                if (ipcRenderer && node.nativePath) {
                    loadingTask = pdfjsLib.getDocument('file://' + node.nativePath.replace(/\\/g, '/'));
                } else if (node.fileHandle) {
                    const file = await node.fileHandle.getFile();
                    const buffer = await file.arrayBuffer();
                    loadingTask = pdfjsLib.getDocument({ data: buffer });
                } else if (node.fileObj) {
                    const buffer = await node.fileObj.arrayBuffer();
                    loadingTask = pdfjsLib.getDocument({ data: buffer });
                }

                if (loadingTask) {
                    node.pdfDoc = await loadingTask.promise;
                    node.totalPages = node.pdfDoc.numPages;
                    await renderPdfPageToCache(node, node.currentPage);
                }
            } catch (e) {
                console.error('PDF load error:', e);
                node.pdfError = true;
            } finally {
                node.isPdfLoading = false;
                renderScene();
            }
        }

        async function renderPdfPageToCache(node, pageNum) {
            if (!node.pdfDoc) return;
            try {
                const page = await node.pdfDoc.getPage(pageNum);
                const viewport = page.getViewport({ scale: 1.5 });
                const offCanvas = document.createElement('canvas');
                offCanvas.width = viewport.width;
                offCanvas.height = viewport.height;
                const offCtx = offCanvas.getContext('2d');
                await page.render({ canvasContext: offCtx, viewport: viewport }).promise;
                node.pdfPageCanvas = offCanvas;
                node.cachedPageNum = pageNum;
                renderScene();
            } catch(e) {
                console.error('PDF page render error:', e);
            }
        }

        // Helper: Trigger manual download/preview load for Online-Only Box Drive file
        function loadOnlinePreview(node) {
            if (!node) return;
            node.isManualLoaded = true;
            if (TEXT_EXTS.includes(node.ext)) {
                triggerLazyFileContentLoad(node);
            } else if (node.ext === 'pdf') {
                triggerLazyPdfLoad(node);
            }
            renderScene();
            updateSidebarUI();
        }

        function renderScene() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Reset active video flag each frame before traversing tree
            state.hasActiveVideoPlaying = false;

            // Subtle Background Grid Lines
            ctx.strokeStyle = 'rgba(30, 41, 59, 0.4)';
            ctx.lineWidth = 1;
            const gridSize = 80 * state.transform.scale;
            const offsetX = state.transform.x % gridSize;
            const offsetY = state.transform.y % gridSize;

            ctx.beginPath();
            for (let x = offsetX; x < canvas.width; x += gridSize) {
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
            }
            for (let y = offsetY; y < canvas.height; y += gridSize) {
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
            }
            ctx.stroke();

            // Render Nodes Recursively
            if (state.rootNode) {
                renderNode(state.rootNode);
            }

            // Continuous animation frame render if active videos are playing
            if (state.hasActiveVideoPlaying) {
                requestAnimationFrame(renderScene);
            }
        }

        function renderNode(node) {
            const screenX = node.x * state.transform.scale + state.transform.x;
            const screenY = node.y * state.transform.scale + state.transform.y;
            const screenW = node.width * state.transform.scale;
            const screenH = node.height * state.transform.scale;

            // Frustum Culling (Skip nodes outside canvas & pause offscreen media)
            if (screenX + screenW < 0 || screenX > canvas.width ||
                screenY + screenH < 0 || screenY > canvas.height) {
                if (node.videoObj && !node.videoObj.paused) {
                    node.videoObj.pause();
                }
                return;
            }

            // Depth 0 Workspace container skips rendering container borders
            if (node.depth === 0) {
                for (let i = 0; i < node.children.length; i++) {
                    renderNode(node.children[i]);
                }
                return;
            }

            // ON-DEMAND LAZY SCAN TRIGGER FOR FOLDERS (Only when zoomed in enough)
            if (node.type === 'folder' && !node.scanned && !node.isScanning && screenW >= 140) {
                triggerLazyFolderScan(node);
            }

            // ON-DEMAND FILE PREVIEW TRIGGER FOR FILES
            if (node.type === 'file' && (!node.isOnlineOnly || node.isManualLoaded) && !node.contentLoaded && !node.isContentLoading && screenW >= 240) {
                triggerLazyFileContentLoad(node);
            }

            // Clip node rendering inside parent panel bounds
            ctx.save();
            ctx.beginPath();
            ctx.rect(screenX, screenY, screenW, screenH);
            ctx.clip();

            const isHovered = state.mouse.x >= screenX && state.mouse.x <= screenX + screenW &&
                              state.mouse.y >= screenY && state.mouse.y <= screenY + screenH;
            const isSelected = state.selectedNode === node;

            // -------------------------------------------------------------
            // RULE: Hidden files and Archive files are ALWAYS Icon-only (Level 1)
            // -------------------------------------------------------------
            const isArchive = ARCHIVE_EXTS.includes(node.ext);
            const isOnlinePending = node.type === 'file' && node.isOnlineOnly && !node.isManualLoaded;
            const isForceIconOnly = node.isHidden || isArchive;

            // -------------------------------------------------------------
            // LEVEL 1: Simplified Icon-Only Card (< 140px or forced icon mode)
            // -------------------------------------------------------------
            if (screenW < 140 || isForceIconOnly) {
                // Clean up hardware-decoding video objects when zoomed out to Level 1
                if (node.videoObj) {
                    node.videoObj.pause();
                    node.videoObj.removeAttribute('src');
                    node.videoObj.load();
                    node.videoObj = null;
                }

                ctx.fillStyle = node.type === 'folder' ? '#1e293b' : '#0f172a';
                ctx.fillRect(screenX, screenY, screenW, screenH);

                ctx.strokeStyle = isSelected ? '#f59e0b' : (isHovered ? '#3b82f6' : '#334155');
                ctx.lineWidth = isSelected ? 3 : (isHovered ? 1.5 : 0.5);
                ctx.strokeRect(screenX, screenY, screenW, screenH);

                if (screenW > 24) {
                    ctx.fillStyle = isSelected ? '#fbbf24' : (node.type === 'folder' ? '#60a5fa' : (node.isHidden ? '#64748b' : '#94a3b8'));
                    const fontSize = Math.max(9, Math.min(13, screenW * 0.1));
                    ctx.font = `${fontSize}px "Inter", sans-serif`;
                    
                    let icon = node.type === 'folder' ? '📁 ' : '📄 ';
                    if (node.isOnlineOnly && !node.isManualLoaded) icon = '☁️ ';
                    else if (node.isHidden) icon = '🔒 ';
                    else if (isArchive) icon = '📦 ';

                    const label = icon + node.name;
                    ctx.fillText(label, screenX + 6, screenY + screenH * 0.5 + 4);
                }
                ctx.restore();
                return;
            }

            // -------------------------------------------------------------
            // LEVEL 2 & LEVEL 3: Full Panel Frame (>= 140px)
            // -------------------------------------------------------------
            ctx.fillStyle = node.type === 'folder' ? '#0f172a' : '#090d16';
            ctx.fillRect(screenX, screenY, screenW, screenH);

            ctx.strokeStyle = isSelected ? '#f59e0b' : (isHovered ? '#3b82f6' : '#1e293b');
            ctx.lineWidth = isSelected ? 3.5 : (isHovered ? 2 : 1);
            ctx.strokeRect(screenX, screenY, screenW, screenH);

            const headerH = screenH * (node.type === 'folder' ? 0.13 : 0.18);
            ctx.fillStyle = isSelected ? 'rgba(245, 158, 11, 0.2)' : (isHovered ? 'rgba(59, 130, 246, 0.15)' : (node.type === 'folder' ? '#1e293b' : '#0f172a'));
            ctx.fillRect(screenX, screenY, screenW, headerH);
            
            ctx.beginPath();
            ctx.moveTo(screenX, screenY + headerH);
            ctx.lineTo(screenX + screenW, screenY + headerH);
            ctx.strokeStyle = isSelected ? '#f59e0b' : (isHovered ? '#3b82f6' : '#334155');
            ctx.stroke();

            // File / Folder Category Icons
            let iconChar = '📁 ';
            if (node.type === 'file') {
                if (node.isOnlineOnly && !node.isManualLoaded) iconChar = '☁️ ';
                else if (IMAGE_EXTS.includes(node.ext)) iconChar = '🖼️ ';
                else if (TEXT_EXTS.includes(node.ext)) iconChar = '📄 ';
                else if (BINARY_EXTS.includes(node.ext)) iconChar = '⚙️ ';
                else if (VIDEO_EXTS.includes(node.ext)) iconChar = '🎬 ';
                else if (AUDIO_EXTS.includes(node.ext)) iconChar = '🎵 ';
                else if (DOC_EXTS.includes(node.ext)) iconChar = '📕 ';
                else iconChar = '💾 ';
            }

            const headerFontSize = Math.max(10, Math.min(18, screenW * 0.032));
            ctx.font = `600 ${headerFontSize}px "Inter", sans-serif`;
            ctx.fillStyle = isSelected ? '#fbbf24' : (isHovered ? '#60a5fa' : (node.type === 'folder' ? '#f8fafc' : '#cbd5e1'));
            ctx.fillText(iconChar + node.name, screenX + 10, screenY + headerH * 0.68);

            // LOD Badge Indicator
            if (screenW > 180) {
                let lodTag = screenW < 550 ? 'LOD 2: Preview' : 'LOD 3: Full';
                if (isSelected) lodTag = 'SELECTED';
                else if (isOnlinePending) lodTag = 'Online Only (Box)';
                else if (node.isScanning || node.isContentLoading) lodTag = 'scanning';
                else if (node.type === 'folder' && node.scanned && node.children.length === 0) lodTag = 'empty';
                else if (node.type === 'folder' && !node.scanned) lodTag = 'Zoom to Scan';

                ctx.font = '10px "JetBrains Mono"';
                ctx.fillStyle = isSelected ? '#fbbf24' : (isOnlinePending ? '#38bdf8' : ((node.isScanning || node.isContentLoading) ? '#38bdf8' : '#64748b'));
                ctx.fillText(`${lodTag} | 16:9`, screenX + screenW - 130, screenY + headerH * 0.68);
            }

            // Render File Contents (LOD 2 & LOD 3 according to strict rules)
            if (node.type === 'file') {
                if (isOnlinePending) {
                    renderOnlineOnlyPlaceholderCard(node, ctx, screenX, screenY + headerH, screenW, screenH - headerH);
                } else {
                renderFlatFilePreview(node, ctx, screenX, screenY + headerH, screenW, screenH - headerH);
            }
            }

            // Render Subfolders & Folder Status Indicators (scanning / empty)
            if (node.type === 'folder' && !node.isHidden) {
                if (node.isScanning) {
                    ctx.fillStyle = '#38bdf8';
                    ctx.font = `${Math.max(11, Math.min(22, screenW * 0.035))}px "JetBrains Mono", monospace`;
                    ctx.textAlign = 'center';
                    ctx.fillText('scanning...', screenX + screenW / 2, screenY + headerH + (screenH - headerH) / 2);
                    ctx.textAlign = 'left';
                } else if (node.scanned && node.children.length === 0) {
                    ctx.fillStyle = '#64748b';
                    ctx.font = `${Math.max(11, Math.min(22, screenW * 0.035))}px "JetBrains Mono", monospace`;
                    ctx.textAlign = 'center';
                    ctx.fillText('empty', screenX + screenW / 2, screenY + headerH + (screenH - headerH) / 2);
                    ctx.textAlign = 'left';
                } else if (node.children.length > 0) {
                for (let i = 0; i < node.children.length; i++) {
                    const child = node.children[i];
                    const childScreenW = child.width * state.transform.scale;
                    if (childScreenW >= 20) {
                        renderNode(child);
                        }
                    }
                }
            }

            ctx.restore();
        }

        // Render Online-Only Placeholder Card (Prevents Auto-Download)
        function renderOnlineOnlyPlaceholderCard(node, ctx, px, py, pw, ph) {
            ctx.fillStyle = '#090d16';
            ctx.fillRect(px, py, pw, ph);

            const iconSize = Math.max(20, Math.min(48, pw * 0.09));
            ctx.font = `${iconSize}px "Inter", sans-serif`;
            ctx.textAlign = 'center';
            ctx.fillText('☁️', px + pw / 2, py + ph / 2 - 12);

            ctx.font = `600 ${Math.max(11, Math.min(16, pw * 0.024))}px "Inter", sans-serif`;
            ctx.fillStyle = '#38bdf8';
            ctx.fillText('オンライン専用ファイル (Box Drive)', px + pw / 2, py + ph / 2 + 16);

            ctx.font = `${Math.max(9, Math.min(12, pw * 0.018))}px "Inter", sans-serif`;
            ctx.fillStyle = '#94a3b8';
            ctx.fillText('自動ダウンロードをスキップしています', px + pw / 2, py + ph / 2 + 34);

            if (pw >= 280) {
                const btnW = Math.min(240, pw * 0.6);
                const btnH = Math.max(22, ph * 0.12);
                const btnX = px + (pw - btnW) / 2;
                const btnY = py + ph / 2 + 48;

                ctx.fillStyle = 'rgba(14, 165, 233, 0.2)';
                ctx.fillRect(btnX, btnY, btnW, btnH);
                ctx.strokeStyle = '#0284c7';
                ctx.lineWidth = 1;
                ctx.strokeRect(btnX, btnY, btnW, btnH);

                ctx.fillStyle = '#38bdf8';
                ctx.font = '500 11px "Inter", sans-serif';
                ctx.fillText('クリックでプレビューをロード', px + pw / 2, btnY + btnH * 0.68);
            }

            ctx.textAlign = 'left';
        }

        function renderFlatFilePreview(node, ctx, px, py, pw, ph) {
            const isLevel3 = pw >= 550;

            // -------------------------------------------------------------
            // 1. Text & Code Files
            // Level 2: ~10 line preview | Level 3: Full text fitted into panel
            // -------------------------------------------------------------
            if (TEXT_EXTS.includes(node.ext)) {
                ctx.fillStyle = '#0f172a';
                ctx.fillRect(px, py, pw, ph);

                const sampleText = node.content || `// Content preview for ${node.name}\n// Zoom closer (Level 3) to view full file content.`;
                const lines = sampleText.split('\n');

                if (isLevel3) {
                    const totalLines = lines.length || 1;
                    const padX = Math.max(6, pw * 0.015);
                    const padY = Math.max(6, ph * 0.015);
                    const availH = Math.max(1, ph - padY * 2);

                    // Dynamically fit all lines into the panel height
                    let calcLineH = availH / totalLines;
                    let calcFontS = calcLineH * 0.82;

                    // Cap maximum font size for short text files so text stays proportional
                    const maxFontS = Math.max(12, Math.min(28, pw * 0.025));
                    if (calcFontS > maxFontS) {
                        calcFontS = maxFontS;
                        calcLineH = calcFontS * 1.35;
                    }

                    ctx.font = `${calcFontS}px "JetBrains Mono", monospace`;
                    ctx.fillStyle = '#94a3b8';

                    let currentY = py + padY + calcFontS;
                    for (let i = 0; i < lines.length; i++) {
                        ctx.fillText(lines[i], px + padX, currentY);
                        currentY += calcLineH;
                    }
                } else {
                    const displayLines = lines.slice(0, 10);
                    const fontSize = Math.max(9, Math.min(12, pw * 0.016));
                const lineHeight = fontSize * 1.35;
                
                ctx.font = `${fontSize}px "JetBrains Mono", monospace`;
                ctx.fillStyle = '#94a3b8';

                let currentY = py + lineHeight + 4;
                for (let i = 0; i < displayLines.length; i++) {
                    if (currentY > py + ph - 10) break;
                    ctx.fillText(displayLines[i].substring(0, 140), px + 12, currentY);
                    currentY += lineHeight;
                }

                    if (lines.length > 10) {
                    ctx.font = '500 11px "Inter", sans-serif';
                    ctx.fillStyle = '#38bdf8';
                    ctx.fillText(`... ${lines.length - 10} more lines (Zoom to Level 3 for full text)`, px + 12, py + ph - 10);
                    }
                }

            // -------------------------------------------------------------
            // 2. Image Files
            // Level 2: Low-res / un-smoothed preview | Level 3: High quality
            // -------------------------------------------------------------
            } else if (IMAGE_EXTS.includes(node.ext)) {
                ctx.fillStyle = '#090d16';
                ctx.fillRect(px, py, pw, ph);

                if (!node.imgObj && node.nativePath) {
                    node.imgObj = new Image();
                    node.imgObj.src = 'file://' + node.nativePath;
                    node.imgObj.onload = () => renderScene();
                }

                if (node.imgObj && node.imgObj.complete && node.imgObj.naturalWidth > 0) {
                    ctx.save();
                    ctx.imageSmoothingEnabled = isLevel3; // Off for LOD 2 fast render, ON for LOD 3 high-res

                    const imgRatio = node.imgObj.naturalWidth / node.imgObj.naturalHeight;
                    const panelRatio = pw / ph;
                    let dw = pw;
                    let dh = ph;
                    let dx = px;
                    let dy = py;

                    if (imgRatio > panelRatio) {
                        dh = pw / imgRatio;
                        dy = py + (ph - dh) / 2;
                    } else {
                        dw = ph * imgRatio;
                        dx = px + (pw - dw) / 2;
                    }

                    ctx.drawImage(node.imgObj, dx, dy, dw, dh);
                    ctx.restore();
                } else {
                    ctx.fillStyle = '#64748b';
                    ctx.font = `${Math.max(10, pw * 0.02)}px "JetBrains Mono"`;
                    ctx.fillText(`[IMAGE PREVIEW] ${node.name}`, px + 12, py + ph / 2);
                }

            // -------------------------------------------------------------
            // 3. Video Files
            // Level 2: Still frame preview | Level 3: Live preview playback
            // -------------------------------------------------------------
            } else if (VIDEO_EXTS.includes(node.ext)) {
                ctx.fillStyle = '#020617';
                ctx.fillRect(px, py, pw, ph);

                if (!node.videoObj && node.nativePath) {
                    node.videoObj = document.createElement('video');
                    node.videoObj.src = 'file://' + node.nativePath;
                    node.videoObj.muted = true;
                    node.videoObj.loop = true;
                    node.videoObj.onloadeddata = () => renderScene();
                }

                if (node.videoObj && node.videoObj.readyState >= 2) {
                    if (isLevel3) {
                        if (node.videoObj.paused) node.videoObj.play();
                        state.hasActiveVideoPlaying = true;
                        ctx.drawImage(node.videoObj, px, py, pw, ph);
                    } else {
                        if (!node.videoObj.paused) node.videoObj.pause();
                        // Render still frame for Level 2
                        ctx.drawImage(node.videoObj, px, py, pw, ph);

                        // Overlay "STILL FRAME" indicator badge for Level 2
                        ctx.fillStyle = 'rgba(15, 23, 42, 0.7)';
                        ctx.fillRect(px + pw - 90, py + ph - 24, 80, 18);
                        ctx.fillStyle = '#38bdf8';
                        ctx.font = '10px "JetBrains Mono"';
                        ctx.fillText('STILL FRAME', px + pw - 84, py + ph - 12);
                    }
                } else {
                    const iconSize = Math.max(20, Math.min(48, pw * 0.08));
                    ctx.font = `${iconSize}px "Inter", sans-serif`;
                    ctx.textAlign = 'center';
                    ctx.fillText('🎬', px + pw / 2, py + ph / 2 - 10);
                    ctx.font = `${Math.max(10, pw * 0.02)}px "JetBrains Mono"`;
                    ctx.fillStyle = '#38bdf8';
                    ctx.fillText(isLevel3 ? 'LOADING VIDEO...' : 'VIDEO STILL PREVIEW', px + pw / 2, py + ph / 2 + 20);
                    ctx.textAlign = 'left';
                }

            // -------------------------------------------------------------
            // 4. Microsoft Office & Document Files (.docx, .xlsx, .pptx, .pdf)
            // Level 2: Summary card / 1st page preview | Level 3: Detailed view & Page flip
            // -------------------------------------------------------------
            } else if (node.ext === 'pdf') {
                ctx.fillStyle = '#0f172a';
                ctx.fillRect(px, py, pw, ph);

                // Load PDF data on demand for both Level 2 and Level 3
                    if (!node.pdfDoc && !node.isPdfLoading && !node.pdfError) {
                        triggerLazyPdfLoad(node);
                    }

                if (node.pdfPageCanvas) {
                    const targetPage = isLevel3 ? (node.currentPage || 1) : 1;
                    if (node.cachedPageNum !== targetPage && isLevel3) {
                        renderPdfPageToCache(node, targetPage);
                    }

                        const imgRatio = node.pdfPageCanvas.width / node.pdfPageCanvas.height;
                        const panelRatio = pw / ph;
                        let dw = pw, dh = ph, dx = px, dy = py;

                        if (imgRatio > panelRatio) {
                            dh = pw / imgRatio;
                            dy = py + (ph - dh) / 2;
                        } else {
                            dw = ph * imgRatio;
                            dx = px + (pw - dw) / 2;
                        }

                        ctx.save();
                    // Level 2: Fast low-res rendering (smoothing off) | Level 3: High resolution (smoothing on)
                    ctx.imageSmoothingEnabled = isLevel3;
                        ctx.drawImage(node.pdfPageCanvas, dx, dy, dw, dh);
                        ctx.restore();

                    if (isLevel3) {
                        // Interactive Page Control Overlay Badge for Level 3
                        ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
                        ctx.fillRect(px + pw / 2 - 110, py + ph - 28, 220, 22);
                        ctx.strokeStyle = '#38bdf8';
                        ctx.strokeRect(px + pw / 2 - 110, py + ph - 28, 220, 22);
                        ctx.fillStyle = '#f8fafc';
                        ctx.font = '600 11px "JetBrains Mono", monospace';
                        ctx.textAlign = 'center';
                        ctx.fillText(`Page ${node.currentPage || 1} / ${node.totalPages || 1} (Ctrl + Wheel)`, px + pw / 2, py + ph - 13);
                        ctx.textAlign = 'left';
                    } else {
                        // Low-Res Preview Badge for Level 2
                        ctx.fillStyle = 'rgba(15, 23, 42, 0.7)';
                        ctx.fillRect(px + pw - 95, py + ph - 24, 85, 18);
                        ctx.fillStyle = '#38bdf8';
                        ctx.font = '10px "JetBrains Mono"';
                        ctx.fillText('PDF PREVIEW', px + pw - 89, py + ph - 12);
                    }
                    } else if (node.isPdfLoading) {
                        ctx.fillStyle = '#38bdf8';
                    ctx.font = `${Math.max(10, pw * 0.02)}px "JetBrains Mono"`;
                        ctx.textAlign = 'center';
                    ctx.fillText('LOADING PDF...', px + pw / 2, py + ph / 2);
                        ctx.textAlign = 'left';
                } else {
                    const iconSize = Math.max(20, Math.min(54, pw * 0.1));
                    ctx.font = `${iconSize}px "Inter", sans-serif`;
                    ctx.textAlign = 'center';
                    ctx.fillText('📕', px + pw / 2, py + ph / 2 - 10);
                    ctx.font = `${Math.max(10, pw * 0.02)}px "JetBrains Mono"`;
                    ctx.fillStyle = '#94a3b8';
                    ctx.fillText('PDF DOCUMENT (.PDF)', px + pw / 2, py + ph / 2 + 20);
                    ctx.textAlign = 'left';
                }

            } else if (DOC_EXTS.includes(node.ext)) {
                ctx.fillStyle = '#0f172a';
                ctx.fillRect(px, py, pw, ph);

                const iconSize = Math.max(20, Math.min(54, pw * 0.1));
                let docIcon = '📕';
                let docType = 'DOCUMENT';
                if (['xls', 'xlsx', 'csv'].includes(node.ext)) { docIcon = '📊'; docType = 'SPREADSHEET'; }
                else if (['ppt', 'pptx'].includes(node.ext)) { docIcon = '📙'; docType = 'PRESENTATION'; }
                else if (['doc', 'docx'].includes(node.ext)) { docIcon = '📘'; docType = 'WORD DOCUMENT'; }

                if (isLevel3) {
                    // Level 3 Detailed Card Layout
                    ctx.fillStyle = 'rgba(30, 41, 59, 0.8)';
                    ctx.fillRect(px + 16, py + 16, pw - 32, ph - 32);

                    ctx.font = `${iconSize}px "Inter", sans-serif`;
                    ctx.fillText(docIcon, px + 32, py + 32 + iconSize);

                    const titleSize = Math.max(12, Math.min(20, pw * 0.025));
                    ctx.font = `600 ${titleSize}px "Inter", sans-serif`;
                    ctx.fillStyle = '#f8fafc';
                    ctx.fillText(node.name, px + 40 + iconSize, py + 40);

                    ctx.font = `${Math.max(10, pw * 0.018)}px "JetBrains Mono"`;
                    ctx.fillStyle = '#38bdf8';
                    ctx.fillText(`FORMAT: Microsoft Office ${docType}`, px + 40 + iconSize, py + 40 + titleSize * 1.5);
                    ctx.fillStyle = '#94a3b8';
                    ctx.fillText(`STATUS: Verified Document Container`, px + 40 + iconSize, py + 40 + titleSize * 2.8);
                } else {
                    // Level 2 Preview Card
                    ctx.font = `${iconSize}px "Inter", sans-serif`;
                    ctx.textAlign = 'center';
                    ctx.fillText(docIcon, px + pw / 2, py + ph / 2 - 10);
                    ctx.font = `${Math.max(10, pw * 0.02)}px "JetBrains Mono"`;
                    ctx.fillStyle = '#94a3b8';
                    ctx.fillText(`${docType} (.${node.ext.toUpperCase()})`, px + pw / 2, py + ph / 2 + 20);
                    ctx.textAlign = 'left';
                }

            // -------------------------------------------------------------
            // 5. Binary Executables & General Fallbacks
            // -------------------------------------------------------------
            } else {
                ctx.fillStyle = '#090d16';
                ctx.fillRect(px, py, pw, ph);

                const iconSize = Math.max(20, Math.min(48, pw * 0.08));
                ctx.font = `${iconSize}px "Inter", sans-serif`;
                ctx.textAlign = 'center';
                ctx.fillText('⚙️', px + pw / 2, py + ph / 2 - 10);
                ctx.font = `${Math.max(10, pw * 0.02)}px "JetBrains Mono"`;
                ctx.fillStyle = '#64748b';
                ctx.fillText(`BINARY DATA (.${node.ext.toUpperCase()})`, px + pw / 2, py + ph / 2 + 20);
                ctx.textAlign = 'left';
            }
        }

        async function appendNativePathToWorkspace(dirPath, autoSave = true) {
            document.getElementById('status-text').textContent = `Adding: ${dirPath}...`;
            state.isLoadingFolder = true;

            const folderName = dirPath.replace(/\\/g, '/').split('/').filter(Boolean).pop() || dirPath;
            
            const rootItem = {
                id: 'native_root_' + Math.random().toString(36).substr(2, 9),
                name: folderName,
                nativePath: dirPath,
                type: 'folder',
                ext: '',
                children: [],
                x: 0, y: 0, width: 1600, height: 900,
                depth: 1,
                scanned: false,
                isScanning: false,
                isHidden: isItemHidden(folderName),
                isExpanded: true
            };

            state.rootNode.children.push(rootItem);
            layoutNodeHierarchy(state.rootNode, 0, 0, 1600, 900, 0);
            resetZoom();

            await triggerLazyFolderScan(rootItem);

            state.isLoadingFolder = false;
            updateStatusText();

            if (autoSave) saveWorkspaceState();
        }

        async function appendDirectoryHandleToWorkspace(handle) {
            document.getElementById('status-text').textContent = `Adding: ${handle.name}...`;
            state.isLoadingFolder = true;

            const rootItem = {
                id: 'handle_root_' + Math.random().toString(36).substr(2, 9),
                name: handle.name,
                directoryHandle: handle,
                type: 'folder',
                ext: '',
                children: [],
                x: 0, y: 0, width: 1600, height: 900,
                depth: 1,
                scanned: false,
                isScanning: false,
                isHidden: isItemHidden(handle.name),
                isExpanded: true
            };

            state.rootNode.children.push(rootItem);
            layoutNodeHierarchy(state.rootNode, 0, 0, 1600, 900, 0);
            resetZoom();

            await triggerLazyFolderScan(rootItem);
            state.isLoadingFolder = false;
            updateStatusText();
        }

        function saveWorkspaceState() {
            if (!state.rootNode) return;
            const nativePaths = state.rootNode.children
                .filter(child => child.nativePath)
                .map(child => child.nativePath);

            if (ipcRenderer) {
                ipcRenderer.invoke('store:saveRoots', nativePaths);
            }
        }

        async function restoreSavedWorkspace() {
            if (ipcRenderer) {
                try {
                    const res = await ipcRenderer.invoke('store:getRoots');
                    if (res.success && res.paths && res.paths.length > 0) {
                        for (const dirPath of res.paths) {
                            await appendNativePathToWorkspace(dirPath, false);
                        }
                    }
                } catch(e) {
                    console.error('Failed to restore roots:', e);
                }
            }
        }

        async function triggerFolderSelect() {
            if (ipcRenderer) {
                try {
                    const res = await ipcRenderer.invoke('dialog:openDirectory');
                    if (res && !res.canceled && res.filePaths && res.filePaths.length > 0) {
                        for (const dirPath of res.filePaths) {
                            await appendNativePathToWorkspace(dirPath, true);
                        }
                    }
                } catch(e) {
                    console.error('Error invoking openDirectory:', e);
                }
            } else {
                const input = document.getElementById('folder-input');
                if (input) input.click();
            }
        }

        function handleBrowserFolderSelect(event) {
            const files = Array.from(event.target.files || []);
            if (files.length > 0) handleBrowserFolderFiles(files);
        }

        function handleBrowserFolderFiles(fileList) {
            document.getElementById('status-text').textContent = `Indexing ${fileList.length} items...`;
            state.isLoadingFolder = true;

            const rootItem = {
                id: 'browser_root_' + Date.now(),
                name: 'Loaded Folder (' + fileList.length + ' files)',
                type: 'folder',
                ext: '',
                children: [],
                x: 0, y: 0, width: 1600, height: 900,
                depth: 1,
                scanned: true,
                isExpanded: true
            };

            buildTreeFromFileListAsync(fileList, rootItem, () => {
                state.rootNode.children.push(rootItem);
                layoutNodeHierarchy(state.rootNode, 0, 0, 1600, 900, 0);
                resetZoom();
                state.isLoadingFolder = false;
                updateStatusText();
            });
        }

        function buildTreeFromFileListAsync(fileList, rootNode, callback) {
            const total = fileList.length;
            let index = 0;
            const chunkSize = 400;

            function processChunk() {
                const end = Math.min(index + chunkSize, total);
                
                for (; index < end; index++) {
                    const file = fileList[index];
                    const rawPath = file.webkitRelativePath || file.name;
                    const pathParts = rawPath.replace(/\\/g, '/').split('/');
                    let currentFolder = rootNode;

                    for (let i = 0; i < pathParts.length - 1; i++) {
                        const dirName = pathParts[i];
                        let existingDir = currentFolder.children.find(c => c.name === dirName && c.type === 'folder');

                        if (!existingDir) {
                            existingDir = {
                                id: 'dir_' + Math.random().toString(36).substr(2, 9),
                                name: dirName,
                                type: 'folder',
                                ext: '',
                                content: '',
                                children: [],
                                x: 0, y: 0, width: 1600, height: 900,
                                depth: currentFolder.depth + 1,
                                isHidden: isItemHidden(dirName),
                                isExpanded: false,
                                parent: currentFolder
                            };
                            currentFolder.children.push(existingDir);
                        }
                        currentFolder = existingDir;
                    }

                    const fileName = pathParts[pathParts.length - 1];
                    const ext = fileName.includes('.') ? fileName.split('.').pop().toLowerCase() : '';

                    currentFolder.children.push({
                        id: 'file_' + Math.random().toString(36).substr(2, 9),
                        name: fileName,
                        type: 'file',
                        ext: ext,
                        content: '',
                        fileObj: file,
                        children: [],
                        x: 0, y: 0, width: 1600, height: 900,
                        depth: currentFolder.depth + 1,
                        isHidden: isItemHidden(fileName),
                        parent: currentFolder
                    });
                }

                document.getElementById('status-text').textContent = `Indexing: ${index} / ${total} items...`;

                if (index < total) {
                    requestAnimationFrame(processChunk);
                } else {
                    sortNodeChildren(rootNode);
                    callback();
                }
            }

            processChunk();
        }

        function setupInteractionEvents() {
            // Mouse Wheel Zooming around cursor & Ctrl+Wheel Page / Scroll Handling
            canvas.addEventListener('wheel', (e) => {
                e.preventDefault();

                const hoverNode = findNodeAtPosition(state.rootNode, e.clientX, e.clientY);
                const isHoveringLevel3Pdf = hoverNode && hoverNode.type === 'file' && hoverNode.ext === 'pdf' &&
                                            (hoverNode.width * state.transform.scale >= 550);

                if (e.ctrlKey) {
                    if (isHoveringLevel3Pdf && hoverNode.pdfDoc) {
                        const delta = e.deltaY > 0 ? 1 : -1;
                        const newPage = Math.max(1, Math.min(hoverNode.totalPages || 1, (hoverNode.currentPage || 1) + delta));
                        if (newPage !== hoverNode.currentPage) {
                            hoverNode.currentPage = newPage;
                            renderPdfPageToCache(hoverNode, newPage);
                        }
                    } else {
                        state.transform.y -= e.deltaY * 1.2;
                        renderScene();
                    }
                    return;
                }

                // Normal Zooming without Ctrl
                const zoomFactor = e.deltaY < 0 ? 1.15 : 0.85;
                const mouseX = e.clientX;
                const mouseY = e.clientY;

                state.transform.x = mouseX - (mouseX - state.transform.x) * zoomFactor;
                state.transform.y = mouseY - (mouseY - state.transform.y) * zoomFactor;
                state.transform.scale *= zoomFactor;

                renderScene();
            }, { passive: false });

            // Mouse Down (Drag & Click Detection)
            canvas.addEventListener('mousedown', (e) => {
                if (e.button === 0) {
                    state.isDragging = true;
                    state.dragStart.x = e.clientX - state.transform.x;
                    state.dragStart.y = e.clientY - state.transform.y;
                    state.mouseDownPos = { x: e.clientX, y: e.clientY };
                    hideContextMenu();
                }
            });

            window.addEventListener('mousemove', (e) => {
                state.mouse.x = e.clientX;
                state.mouse.y = e.clientY;

                if (state.isDragging) {
                    state.transform.x = e.clientX - state.dragStart.x;
                    state.transform.y = e.clientY - state.dragStart.y;
                }
                renderScene();
            });

            window.addEventListener('mouseup', (e) => {
                if (state.isDragging) {
                    const distMoved = Math.hypot(e.clientX - state.mouseDownPos.x, e.clientY - state.mouseDownPos.y);
                    // Treat as click selection if mouse moved less than 5px during drag
                    if (distMoved < 5) {
                        const clickedNode = findNodeAtPosition(state.rootNode, e.clientX, e.clientY);
                        if (clickedNode && clickedNode.depth > 0) {
                            selectNode(clickedNode);
                        }
                    }
                }
                state.isDragging = false;
            });

            // Context Menu Right Click
            canvas.addEventListener('contextmenu', (e) => {
                e.preventDefault();
                const clickedNode = findNodeAtPosition(state.rootNode, e.clientX, e.clientY);
                if (clickedNode && clickedNode.depth > 0) {
                    state.selectedContextNode = clickedNode;
                    selectNode(clickedNode);
                    showContextMenu(e.clientX, e.clientY, clickedNode);
                } else {
                    state.selectedContextNode = null;
                    showContextMenu(e.clientX, e.clientY, null);
                }
            });

            // Drag & Drop Folders
            window.addEventListener('dragover', (e) => {
                e.preventDefault();
                document.getElementById('drop-overlay').classList.remove('opacity-0', 'pointer-events-none');
            });

            window.addEventListener('dragleave', (e) => {
                if (e.clientX <= 0 || e.clientY <= 0 || e.clientX >= window.innerWidth || e.clientY >= window.innerHeight) {
                    document.getElementById('drop-overlay').classList.add('opacity-0', 'pointer-events-none');
                }
            });

            window.addEventListener('drop', async (e) => {
                e.preventDefault();
                document.getElementById('drop-overlay').classList.add('opacity-0', 'pointer-events-none');
                
                const items = e.dataTransfer.items;
                if (items) {
                    for (let i = 0; i < items.length; i++) {
                        const item = items[i];
                        if (item.kind === 'file') {
                            const entry = item.webkitGetAsEntry ? item.webkitGetAsEntry() : null;
                            if (entry && entry.isDirectory) {
                                if (item.getAsFileSystemHandle) {
                                    const handle = await item.getAsFileSystemHandle();
                                    if (handle) await appendDirectoryHandleToWorkspace(handle);
                                }
                            }
                        }
                    }
                }
            });
        }

        // Helper: Expand all parent folders leading up to the target node
        function expandAncestors(node) {
            let curr = node ? node.parent : null;
            while (curr) {
                if (curr.type === 'folder') {
                    curr.isExpanded = true;
                }
                curr = curr.parent;
            }
        }

        // Selection & Sidebar Updates

                    if (activeTreeEl) {
                        activeTreeEl.scrollIntoView({ block: 'nearest', behavior: 'smooth' });

        }
