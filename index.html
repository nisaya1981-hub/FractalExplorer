        // Toggle Expand / Collapse Tree Folder Node
        function toggleTreeExpand(nodeId, event) {
            if (event) event.stopPropagation();
            const node = findNodeById(state.rootNode, nodeId);
            if (node && node.type === 'folder') {
                node.isExpanded = !node.isExpanded;
                renderTreeView();
            }
        }

        function renderTreeView() {
            const container = document.getElementById('tree-view-container');
            const countLabel = document.getElementById('tree-node-count');
            
            if (!state.rootNode || !state.rootNode.children || state.rootNode.children.length === 0) {
                container.innerHTML = '<div class="text-slate-500 italic p-2 text-center text-[11px]">No items in workspace</div>';
                countLabel.textContent = '0 items';
                return;
            }

            let html = '';
            let totalCount = 0;

            function buildTreeHTML(node, indent = 0) {
                if (node.depth > 0) {
                    totalCount++;
                    const isSelected = state.selectedNode === node;
                    const isDir = node.type === 'folder';
                    const indentPx = indent * 12;

                    let arrowHtml = '<span class="w-3 text-center inline-block"></span>';
                    if (isDir) {
                        const arrowChar = node.isExpanded ? '▼' : '▶';
                        arrowHtml = `<span onclick="toggleTreeExpand('${node.id}', event)" class="w-3 text-center inline-block cursor-pointer text-slate-400 hover:text-blue-400 text-[9px] select-none">${arrowChar}</span>`;
                    }

                    let icon = isDir ? (node.scanned ? '📁' : '📂') : '📄';
                    if (node.isOnlineOnly && !node.isManualLoaded) icon = '☁️';

                    html += `
                        <div data-id="${node.id}" onclick="event.stopPropagation(); selectNodeById('${node.id}')" 
                             class="tree-item px-1.5 py-1 rounded cursor-pointer transition-colors flex items-center space-x-1 truncate ${isSelected ? 'active text-blue-300 font-semibold' : 'text-slate-300'}"
                             style="padding-left: ${indentPx + 4}px;">
                            ${arrowHtml}
                            <span class="text-xs">${icon}</span>
                            <span class="truncate ml-0.5">${node.name}</span>
                        </div>
                    `;
                }

                if (node.children && node.children.length > 0) {
                    // Only render sub-children if the current folder node is expanded or is workspace root (depth 0)
                    if (node.depth === 0 || node.isExpanded) {
                    for (const child of node.children) {
                        buildTreeHTML(child, indent + (node.depth > 0 ? 1 : 0));
                    }
                }
            }
            }

            buildTreeHTML(state.rootNode, 0);
            container.innerHTML = html;
            countLabel.textContent = `${totalCount} items`;
        }

        function selectNodeById(id) {
            const found = findNodeById(state.rootNode, id);
            if (found) {
                selectNode(found);
                zoomToNode(found);
            }
        }

        function findNodeById(node, id) {
            if (node.id === id) return node;
            if (node.children) {
                for (const child of node.children) {
                    const res = findNodeById(child, id);
                    if (res) return res;
                }
            }
            return null;
        }

        function jumpToEnteredPath() {
            const input = document.getElementById('path-input');
            if (!input || !input.value.trim()) return;

            const query = input.value.trim().toLowerCase();
            const target = findNodeByPathOrName(state.rootNode, query);

            if (target) {
                selectNode(target);
                zoomToNode(target);
            } else {
                document.getElementById('status-text').textContent = `Target not found: "${input.value}"`;
                setTimeout(() => updateStatusText(), 3000);
            }
        }

        function findNodeByPathOrName(node, query) {
            if (node.depth > 0) {
                const normPath = (node.nativePath || '').toLowerCase().replace(/\\/g, '/');
                const normName = (node.name || '').toLowerCase();
                const normQuery = query.replace(/\\/g, '/');

                if (normPath === normQuery || normName === normQuery || normPath.endsWith('/' + normQuery)) {
                    return node;
                }
            }

            if (node.children) {
                for (const child of node.children) {
                    const found = findNodeByPathOrName(child, query);
                    if (found) return found;
                }
            }
            return null;
        }

        function zoomToNode(node) {
            if (!node) return;
            // Calculate scale to make node take ~50% of screen height
            const targetScale = (canvas.height * 0.5) / node.height;
            const targetX = canvas.width / 2 - (node.x + node.width / 2) * targetScale;
            const targetY = canvas.height / 2 - (node.y + node.height / 2) * targetScale;

            state.transform.scale = targetScale;
            state.transform.x = targetX;
            state.transform.y = targetY;

            renderScene();
        }

        function findNodeAtPosition(node, mx, my) {
            const screenX = node.x * state.transform.scale + state.transform.x;
            const screenY = node.y * state.transform.scale + state.transform.y;
            const screenW = node.width * state.transform.scale;
            const screenH = node.height * state.transform.scale;

            if (mx >= screenX && mx <= screenX + screenW && my >= screenY && my <= screenY + screenH) {
                if (node.children && node.children.length > 0) {
                    for (const child of node.children) {
                        const found = findNodeAtPosition(child, mx, my);
                        if (found) return found;
                    }
                }
                return node;
            }
            return null;
        }

        // --- Windows 11 Right-Click Context Menu Logic ---
        function showContextMenu(x, y, node) {
            const menu = document.getElementById('context-menu');
            const nameEl = document.getElementById('ctx-item-name');
            const rootGroupEl = document.getElementById('ctx-root-delete-group');
            const pasteBtn = document.getElementById('ctx-btn-paste');
    
            nameEl.textContent = node ? node.name : 'Workspace Background';
            
            if (node && node.depth === 1) {
                rootGroupEl.classList.remove('hidden');
            } else {
                rootGroupEl.classList.add('hidden');
            }
    
            if (state.clipboard) {
                pasteBtn.removeAttribute('disabled');
            } else {
                pasteBtn.setAttribute('disabled', 'true');
            }
    
            // Boundary positioning
            const menuW = 256;
            const menuH = 340;
            const posX = Math.min(x, window.innerWidth - menuW - 10);
            const posY = Math.min(y, window.innerHeight - menuH - 10);
    
            menu.style.left = `${posX}px`;
            menu.style.top = `${posY}px`;
            menu.classList.remove('hidden');
        }

        function hideContextMenu() {
            document.getElementById('context-menu').classList.add('hidden');
        }
    
        // Context Menu Action 1: Open with Default Associated App
        async function ctxOpenDefaultApp() {
            hideContextMenu();
            const node = state.selectedNode;
            if (node && node.nativePath && ipcRenderer) {
                const res = await ipcRenderer.invoke('shell:openPath', node.nativePath);
                if (!res.success) {
                    alert('アプリケーションを開けませんでした: ' + res.error);
                }
            }
        }
    
        // Context Menu Action 2: Open / Show item in Windows Explorer
        async function ctxShowInExplorer() {
            hideContextMenu();
            const node = state.selectedNode;
            if (node && node.nativePath && ipcRenderer) {
                await ipcRenderer.invoke('shell:showItemInFolder', node.nativePath);
            }
        }
    
        // Context Menu Action 3: Cut Item
        function ctxCutItem() {
            hideContextMenu();
            if (state.selectedNode) {
                state.clipboard = { action: 'cut', node: state.selectedNode };
                document.getElementById('status-text').textContent = `Cut: "${state.selectedNode.name}"`;
            }
        }
    
        // Context Menu Action 4: Copy Item
        function ctxCopyItem() {
            hideContextMenu();
            if (state.selectedNode) {
                state.clipboard = { action: 'copy', node: state.selectedNode };
                document.getElementById('status-text').textContent = `Copied: "${state.selectedNode.name}"`;
            }
        }
    
        // Context Menu Action 5: Paste Item
        async function ctxPasteItem() {
            hideContextMenu();
            if (!state.clipboard || !state.clipboard.node || !ipcRenderer) return;
    
            const srcNode = state.clipboard.node;
            let destNode = state.selectedNode;
    
            if (!destNode || destNode.type !== 'folder') {
                destNode = srcNode.parent || state.rootNode;
            }
    
            if (!destNode || !destNode.nativePath) return;
    
            const destPath = destNode.nativePath + '/' + srcNode.name;
            const action = state.clipboard.action;
    
            document.getElementById('status-text').textContent = `Pasting to "${destNode.name}"...`;
    
            if (action === 'cut') {
                const res = await ipcRenderer.invoke('fs:moveItem', { srcPath: srcNode.nativePath, destPath });
                if (res.success) {
                    if (srcNode.parent && srcNode.parent.children) {
                        srcNode.parent.children = srcNode.parent.children.filter(c => c.id !== srcNode.id);
                    }
                    state.clipboard = null;
                } else {
                    alert('移動エラー: ' + res.error);
                }
            } else if (action === 'copy') {
                const res = await ipcRenderer.invoke('fs:copyItem', { srcPath: srcNode.nativePath, destPath });
                if (!res.success) {
                    alert('コピーエラー: ' + res.error);
                }
            }
    
            await triggerLazyFolderScan(destNode, true);
            layoutNodeHierarchy(state.rootNode, 0, 0, 1600, 900, 0);
            renderScene();
            renderTreeView();
            updateStatusText();
        }
    
        // Context Menu Action 6: New File / Folder Prompts
        function ctxPromptNewItem(type) {
            hideContextMenu();
            const targetFolder = (state.selectedNode && state.selectedNode.type === 'folder') 
                ? state.selectedNode 
                : ((state.selectedNode && state.selectedNode.parent) ? state.selectedNode.parent : state.rootNode.children[0]);
    
            if (!targetFolder || !targetFolder.nativePath) {
                alert('作成先のフォルダが選択されていません。');
                return;
            }
    
            openActionModal(
                type === 'file' ? '新規ファイルの作成' : '新規フォルダの作成',
                `作成先: ${targetFolder.nativePath}`,
                type === 'file' ? 'new_file.txt' : 'New Folder',
                async (val) => {
                    if (!val.trim()) return;
                    const channel = type === 'file' ? 'fs:createFile' : 'fs:createFolder';
                    const payload = type === 'file' 
                        ? { parentDir: targetFolder.nativePath, fileName: val.trim() }
                        : { parentDir: targetFolder.nativePath, folderName: val.trim() };
    
                    const res = await ipcRenderer.invoke(channel, payload);
                    if (res.success) {
                        await triggerLazyFolderScan(targetFolder, true);
                        layoutNodeHierarchy(state.rootNode, 0, 0, 1600, 900, 0);
                        renderScene();
                        renderTreeView();
                    } else {
                        alert('作成に失敗しました: ' + res.error);
                    }
                }
            );
        }
    
        // Context Menu Action 7: Rename Item
        function ctxPromptRename() {
            hideContextMenu();
            const node = state.selectedNode;
            if (!node || !node.nativePath || !ipcRenderer) return;
    
            openActionModal(
                '名前の変更',
                `新しい名称を入力してください (${node.name}):`,
                node.name,
                async (newName) => {
                    if (!newName.trim() || newName.trim() === node.name) return;
                    const parts = node.nativePath.replace(/\\/g, '/').split('/');
                    parts.pop();
                    const newPath = parts.join('/') + '/' + newName.trim();
    
                    const res = await ipcRenderer.invoke('fs:rename', { oldPath: node.nativePath, newPath });
                    if (res.success) {
                        node.name = newName.trim();
                        node.nativePath = newPath;
                        if (node.type === 'file' && node.name.includes('.')) {
                            node.ext = node.name.split('.').pop().toLowerCase();
                        }
                        if (node.parent) {
                            sortNodeChildren(node.parent);
                            layoutNodeHierarchy(state.rootNode, 0, 0, 1600, 900, 0);
                        }
                        selectNode(node);
                        renderScene();
                        renderTreeView();
                    } else {
                        alert('名前の変更に失敗しました: ' + res.error);
                    }
                }
            );
        }
    
        // Context Menu Action 8: Delete Item (To Trash)
        function ctxDeleteItem() {
            hideContextMenu();
            const node = state.selectedNode;
            if (!node || !node.nativePath || !ipcRenderer) return;
    
            if (confirm(`"${node.name}" をゴミ箱に移動しますか？`)) {
                ipcRenderer.invoke('fs:delete', node.nativePath).then(res => {
                    if (res.success) {
                        if (node.parent && node.parent.children) {
                            node.parent.children = node.parent.children.filter(c => c.id !== node.id);
                        } else if (node.depth === 1) {
                            state.rootNode.children = state.rootNode.children.filter(c => c.id !== node.id);
                        }
                        state.selectedNode = null;
                        layoutNodeHierarchy(state.rootNode, 0, 0, 1600, 900, 0);
                        updateSidebarUI();
                        renderScene();
                        saveWorkspaceState();
                    } else {
                        alert('削除に失敗しました: ' + res.error);
                    }
                });
            }
        }
    
        // Context Menu Action 9: Copy Full Path
        function ctxCopyFullPath() {
            hideContextMenu();
            const node = state.selectedNode;
            if (node && (node.nativePath || node.name)) {
                navigator.clipboard.writeText(node.nativePath || node.name);
                document.getElementById('status-text').textContent = 'Copied path to clipboard';
                setTimeout(() => updateStatusText(), 2000);
            }
        }
    
        // Context Menu Action 10: Copy File Name
        function ctxCopyFileName() {
            hideContextMenu();
            const node = state.selectedNode;
            if (node && node.name) {
                navigator.clipboard.writeText(node.name);
                document.getElementById('status-text').textContent = 'Copied file name to clipboard';
                setTimeout(() => updateStatusText(), 2000);
            }
        }
    
        // Operation Modal Handler
        function openActionModal(title, desc, defaultVal, callback) {
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-desc').textContent = desc;
            const input = document.getElementById('modal-input');
            input.value = defaultVal;
            state.activeModalCallback = callback;
            document.getElementById('action-modal').classList.remove('hidden');
            setTimeout(() => { input.focus(); input.select(); }, 50);
        }
    
        function closeActionModal() {
            document.getElementById('action-modal').classList.add('hidden');
            state.activeModalCallback = null;
        }
    
        function submitActionModal() {
            const val = document.getElementById('modal-input').value;
            const cb = state.activeModalCallback;
            closeActionModal();
            if (cb) cb(val);
        }

        function removeSelectedRoot() {
            const node = state.selectedContextNode || state.selectedNode;
            if (node && state.rootNode) {
                state.rootNode.children = state.rootNode.children.filter(c => c.id !== node.id);
                if (state.selectedNode === node) {
                    state.selectedNode = null;
                }
                layoutNodeHierarchy(state.rootNode, 0, 0, 1600, 900, 0);
                hideContextMenu();
                resetZoom();
                updateSidebarUI();
                renderScene();
                updateStatusText();
                saveWorkspaceState();
            }
        }

        function resetZoom() {
            state.transform.scale = 0.85;
            state.transform.x = window.innerWidth / 2 - 800 * state.transform.scale;
            state.transform.y = window.innerHeight / 2 - 450 * state.transform.scale;
            renderScene();
        }

        function updateStatusText() {
            const count = state.rootNode ? state.rootNode.children.length : 0;
            document.getElementById('status-text').textContent = count === 0 ? 'Empty Workspace - Click "+ Add Folder / Drive"' : `Active Roots: ${count} item(s)`;
            renderTreeView();
        }

        // App Entry Point
        window.onload = async function() {
            initCanvases();
            state.rootNode = createEmptyWorkspace();
            resetZoom();
            setupInteractionEvents();
            renderScene();
            updateStatusText();

            // Auto-restore saved roots from previous session
            await restoreSavedWorkspace();
        };
    </script>
</body>
</html>
